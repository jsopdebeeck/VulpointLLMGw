# llmgw : configuration. Rechargée automatiquement à chaque sauvegarde
# (sauf listen, db et upstream_timeout_sec qui demandent un redémarrage).

[server]
listen = "127.0.0.1:8080"
db = "gateway.db"                 # SQLite, relatif à ce fichier
admin_token = "change-moi"        # dashboard + /admin/api (vide = ouvert)
raw_retention_days = 30           # détail par requête, puis agrégats journaliers
agg_retention_days = 200          # ~6 mois d'agrégats (profondeur maximale du reporting)
max_body_mb = 50
upstream_timeout_sec = 300

# ---------------------------------------------------------------- LLM cibles
# api = "openai"    → base_url se termine par /v1  (POST {base_url}/chat/completions)
# api = "anthropic" → base_url sans /v1             (POST {base_url}/v1/messages)
# models : globs acceptés ("claude-*", "*"). Clé : api_key_env (recommandé) ou api_key.

[targets.local]
api = "openai"
base_url = "http://localhost:11434/v1"    # Ollama
models = ["*"]

[targets.openai]
api = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini", "gpt-4.1*"]
stream_usage = true                       # compte les tokens aussi en streaming

[targets.mistral]
api = "openai"
base_url = "https://api.mistral.ai/v1"
api_key_env = "MISTRAL_API_KEY"
models = ["mistral-*"]
stream_usage = true

[targets.anthropic]
api = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
models = ["claude-*"]

[targets.deepseek]
api = "openai"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
models = ["deepseek-flash", "deepseek-v4-pro"]
stream_usage = true
downgrade_json_schema = true

[targets.grok]
api = "openai"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
models = ["grok-*"]

[targets.glm]
api = "openai"
base_url = "https://api.z.ai/api/paas/v4"          # Chine continentale : https://open.bigmodel.cn/api/paas/v4
api_key_env = "ZAI_API_KEY"
models = ["glm-*"]

# ---------------------------------------------------------------- privacy
# Termes jamais anonymisés (produits, marques, personnalités publiques…). Pour un nom,
# il suffit que le premier mot soit listé : "Claude" couvre aussi « Claude Code ».

[privacy]
allow = ["Claude", "Claude Code", "GitHub", "Anthropic", "OpenAI", "Mistral"]

# ---------------------------------------------------------------- debug
# Archive complète des échanges pour le dépannage (onglet Debug du dashboard) :
# requête vue par le LLM, réponse brute, correspondances jeton → valeur, mots détectés.
# ATTENTION : les valeurs d'origine sont stockées EN CLAIR. À activer le temps d'un diagnostic.

[debug]
enabled = false
retention_hours = 24      # purge automatique
max_kb = 1024             # taille max archivée par requête / réponse

# ---------------------------------------------------------------- alertes
# Récapitulatif par email (violations, quotas, erreurs LLM) toutes les interval_minutes,
# envoyé aux alert_emails du profil concerné et aux destinataires "to". Sans valeur sensible.

[alerts]
enabled = false
smtp_host = "smtp.office365.com"
smtp_port = 587                     # 587 STARTTLS, 465 TLS
smtp_user = "llmgw@exemple.be"
smtp_password_env = "SMTP_PASSWORD"
from = "llmgw@exemple.be"
to = ["rssi@exemple.be"]
interval_minutes = 15
on_violation = true
on_quota = true
on_error = true

# ---------------------------------------------------------------- authentification (SSO)
# Connexion au portail /chat et au dashboard avec Microsoft Entra ID, Google ou un fournisseur
# OpenID Connect, EN PLUS des clés gateway (API) et de admin_token. Sans fournisseur : inchangé.
# Adresse de retour à déclarer chez le fournisseur : <base_url>/auth/callback/<id>
#
# Profil d'une personne connectée, dans cet ordre :
#   1. un [users.x] avec email = son adresse : son profil et ses quotas ;
#   2. la première règle mappings qui correspond (groupe Entra, rôle d'application, email) ;
#   3. default_profile ; sinon l'accès est refusé (sauf administrateur : dashboard seulement).

[auth]
# base_url = "https://gateway.exemple.be"   # adresse publique ; défaut http://<listen>
session_hours = 12
disable_keys = false                         # true : portail en SSO uniquement

