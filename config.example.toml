# ---------------------------------------------------------------- détecteurs
# Types intégrés : email, phone, iban, niss (NISS belge, avec contrôle), card (Luhn), ipv4,
#   inami            : numéro INAMI / RIZIV d'un prestataire de soins (1-23456-25-001, clé vérifiée)
#   person_title     : nom après un titre (fautes tolérées : Moniseur) ou un mot de contexte (patient, client, nommé…)
#   person_firstname : prénom connu + nom (Gérald Keizer) ou NOM + prénom (KEIZER Gérald)
#   person_learned   : mémoire des noms déjà vus, fautes de frappe comprises (empreintes HMAC seulement)
# Personnalisés   : regex = '…' (group = n pour ne garder qu'un groupe)
#                   words = [...] et/ou words_file = "fichier.txt" (1 terme par ligne)
#                   un terme en MAJUSCULES est un sigle : reconnu seulement en majuscules
#                   (« HUB » oui, « hub » non) ; ajoutez la forme minuscule pour l'inclure
# Le nom devient le type du jeton : «EMAIL_1», «PERSON_2»…
# Ordre = priorité en cas de chevauchement de même longueur.

[[detectors]]
name = "EMAIL"
builtin = "email"

[[detectors]]
name = "NISS"
builtin = "niss"

[[detectors]]
name = "INAMI"
builtin = "inami"

[[detectors]]
name = "IBAN"
builtin = "iban"

[[detectors]]
name = "CARD"
builtin = "card"

[[detectors]]
name = "PHONE"
builtin = "phone"

[[detectors]]
name = "PERSON"
builtin = "person_title"

[[detectors]]
name = "PERSON"
builtin = "person_firstname"

[[detectors]]
name = "PERSON"
builtin = "person_learned"

[[detectors]]
name = "PERSON"                   # même type : même numérotation
words = ["Jean Martin", "Claire Dubois"]
# words_file = "noms.txt"

[[detectors]]
name = "COMPANY"
words = ["ACME SA", "ACME", "Globex"]
# words_file = "entreprises.txt"

[[detectors]]
name = "DOSSIER"
regex = '\bDOS-\d{4}-\d{5}\b'

[[detectors]]
name = "REF"
builtin = "ref_context"       # « Dossier patient 676888-67 », « n° 12345 », « réf. AB-2025/77 »

[[detectors]]
name = "BIRTHDATE"
builtin = "birthdate"         # « né le 30/12/2006 » ; builtin = "date" pour toutes les dates

[[detectors]]
name = "COMPANY"
builtin = "be_health_orgs"    # HUB / H.U.B., Erasme, Bordet, HUDERF, CHU, UZ, AZ…

[[detectors]]
name = "ADDRESS"
builtin = "address"           # rue de la Loi 16 · Kerkstraat 12 · 6041 Gosselies

[[detectors]]
name = "PLACE"
builtin = "place"             # localités belges + « domicilié à X »

[[detectors]]
name = "PERSON"
builtin = "firstname_alone"   # prénom seul : Luc, Els, Tom… (plus de faux positifs possibles)

[[detectors]]
name = "PET"
builtin = "pet"               # mon chien Rex

[[detectors]]
name = "ID"
regex = '\b(?:CLI|PAT)-\d{6,}\b'

# ---------------------------------------------------------------- profils
# targets          : LLM autorisés, dans l'ordre de préférence (repli si panne, 5xx ou 429)
# default_action   : anonymize | block | log | off (appliquée aux types non listés)
# actions          : action par type de donnée
# images           : pass (non changée) | blank (remplacée par un carré blanc) | block (requête refusée + journal)
# files            : action par extension de fichier :
#                    pass_log (transmis + journal) | blank (remplacé par un carré blanc)
#                    block (requête refusée + journal) | block_alert (refusée + alerte email + journal)
# files_default    : action pour les extensions non listées (pass_log par défaut)
#                    Le journal des fichiers (nom, extension, taille, empreinte SHA-256, action) est
#                    conservé 30 jours, même sans mode Debug ; le contenu n'est jamais stocké.
# placeholder_hint : ajoute une consigne demandant au LLM de conserver les «JETONS»
# system_prompt    : prompt de comportement ajouté en tête de chaque requête du profil
# alert_emails     : destinataires des alertes pour ce profil (voir [alerts])

[profiles.interne]
description = "Données sensibles autorisées, LLM local uniquement"
targets = ["local"]
images = "pass"
default_action = "log"

[profiles.standard]
description = "Cloud autorisé, tout est pseudonymisé"
targets = ["mistral", "anthropic", "openai", "local"]
images = "blank"
files = { zip = "block", "7z" = "block", rar = "block", exe = "block_alert" }
default_action = "anonymize"
placeholder_hint = true

[profiles.strict]
description = "Cloud, NISS/IBAN/carte interdits"
system_prompt = "Tu assistes des professionnels de santé. Réponds en français, de façon factuelle ; ne pose jamais de diagnostic."
alert_emails = ["rssi@exemple.be"]
targets = ["mistral", "local"]
images = "block"
files = { pdf = "blank", docx = "blank", xlsx = "block_alert", csv = "block_alert" }
files_default = "block"
default_action = "anonymize"
actions = { NISS = "block", IBAN = "block", CARD = "block" }
placeholder_hint = true

# ---------------------------------------------------------------- utilisateurs
# Le client envoie sa clé gateway dans "Authorization: Bearer <key>" ou "x-api-key".
# key accepte ${VAR} pour lire une variable d'environnement.

[users.alice]
key = "gw-alice-remplace-moi"
profile = "standard"

[users.bob]
key = "gw-bob-remplace-moi"
profile = "strict"

[users.labo]
key = "gw-labo-remplace-moi"
profile = "interne"
