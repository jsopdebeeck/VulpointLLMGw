<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway Chat</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e2de; --grid: #ecebe7;
  --text: #0b0b0b; --text2: #52514e; --muted: #858480; --accent: #2a78d6; --userbg: #e8f0fb;
  --good: #0ca30c; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text: #fff; --text2: #c3c2b7; --muted: #8d8c85; --accent: #3987e5; --userbg: #1d2a3b; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --grid: #262624;
  --text: #fff; --text2: #c3c2b7; --muted: #8d8c85; --accent: #3987e5; --userbg: #1d2a3b; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
.who { font-size: 12px; color: var(--text2); }
.spacer { flex: 1; }
input, select, textarea, button { font: inherit; color: var(--text); }
input, select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
button.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
#log { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
.wrap { max-width: 860px; margin: 0 auto; }
.msg { margin: 0 0 18px; display: flex; flex-direction: column; }
.msg.user { align-items: flex-end; }
.bubble { max-width: 100%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; overflow-wrap: anywhere; }
.user .bubble { background: var(--userbg); max-width: 85%; white-space: pre-wrap; }
.assistant .bubble { background: var(--surface); border: 1px solid var(--border); width: 100%; }
.assistant .bubble p { margin: 0 0 .6em; } .assistant .bubble p:last-child { margin: 0; }
.bubble pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; }
.bubble code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9em; }
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--text2); background: var(--surface); }
.badge.shield::before { content: "⇄"; color: var(--accent); }
.badge.none::before { content: "✓"; color: var(--good); }
.att { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; margin: 4px 6px 0 0; }
.att button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; }
.att img { height: 28px; border-radius: 4px; }
.err { color: var(--critical); }
footer { border-top: 1px solid var(--border); padding: 10px 16px 14px; background: var(--bg); }
.composer { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
.composer.drag { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; min-height: 44px; max-height: 240px; padding: 4px 6px; }
.row { display: flex; gap: 8px; align-items: center; }
.hint { font-size: 12px; color: var(--muted); }
#login { max-width: 420px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
#login h2 { margin: 0 0 4px; font-size: 17px; }
.sso { display: grid; gap: 8px; margin: 14px 0 6px; }
.sso a { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); text-decoration: none; font-weight: 600; }
.sso a:hover, .sso a:focus-visible { border-color: var(--accent); outline: none; }
.sso .ic { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); }
.sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 14px 0 4px; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.empty { text-align: center; color: var(--muted); margin-top: 12vh; }
.empty b { color: var(--text); display: block; font-size: 18px; margin-bottom: 6px; }
.cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
/* conversation history (left panel) */
#shell { flex: 1; display: flex; min-height: 0; }
#side { width: 250px; flex: none; border-right: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
#side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 14px 6px; font-weight: 600; }
#convs { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
.conv { position: relative; display: flex; align-items: center; gap: 4px; border-radius: 8px; padding: 2px 2px 2px 0; }
.conv:hover, .conv.cur { background: var(--surface); }
.conv.cur { box-shadow: inset 2px 0 0 var(--accent); }
.conv .open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; cursor: pointer; padding: 6px 8px; }
.conv .t { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .d { display: block; font-size: 11px; color: var(--muted); }
.conv .more { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 16px; line-height: 1; }
.conv .more:hover, .conv .more:focus-visible { color: var(--text); background: var(--bg); }
.menu { position: absolute; right: 4px; top: 34px; z-index: 5; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 4px; min-width: 150px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--bg); }
.menu .danger { color: var(--critical); }
#side .none { font-size: 12px; color: var(--muted); padding: 6px 10px; }
#side .note { font-size: 11px; color: var(--muted); padding: 8px 14px 12px; border-top: 1px solid var(--border); }
#mainc { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
#toggleSide { display: none; }
@media (max-width: 760px) {
  #side { position: fixed; top: 0; bottom: 0; left: 0; z-index: 10; box-shadow: 0 0 30px rgba(0,0,0,.3); }
  #side:not(.show) { display: none; }
  #toggleSide { display: inline-block; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>Connexion au gateway</h2>
  <div id="sso" class="sso" hidden></div>
  <div id="keylogin">
    <p class="hint" id="keyhint">Saisissez votre clé gateway personnelle (fournie par l'administrateur). Elle reste dans cet onglet.</p>
    <form id="loginf" class="row"><input id="key" type="password" style="flex:1" autocomplete="off" placeholder="gw-…"><button class="btn primary">Entrer</button></form>
  </div>
  <p id="loginerr" class="err"></p>
  <p style="text-align:right;margin:10px 0 0"><select class="langsel" aria-label="Langue"></select></p>
</div>

<header id="top" hidden>
  <button class="btn" id="toggleSide" title="Afficher l'historique" aria-label="Afficher l'historique">☰</button>
  <h1>Gateway Chat</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <select id="modelSel" aria-label="Modèle" style="max-width:260px"></select>
  <input id="model" placeholder="nom du modèle" style="width:200px" hidden aria-label="Autre modèle">
  <button class="btn" id="new">Nouvelle conversation</button>
  <select class="langsel" aria-label="Langue"></select>
  <button class="btn" id="theme" title="Thème">◐</button>
  <button class="btn" id="logout">Déconnexion</button>
</header>
<div id="shell">
<aside id="side" hidden aria-label="Conversations">
  <h3>Conversations</h3>
  <div id="convs"></div>
  <div class="note">Les 10 dernières, conservées dans ce navigateur.</div>
</aside>
<div id="mainc">
<main id="log" hidden><div class="wrap" id="msgs"></div></main>
<footer id="foot" hidden>
  <div class="composer" id="composer">
    <div id="atts"></div>
    <textarea id="input" rows="1" placeholder="Votre message… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)"></textarea>
    <div class="row">
      <button class="btn" id="attach" title="Joindre un document ou une image">📎 Joindre</button>
      <input type="file" id="file" multiple hidden accept=".txt,.md,.csv,.json,.xml,.html,.log,.yaml,.yml,.pdf,.docx,image/*">
      <span class="hint" id="policy"></span>
      <span class="spacer"></span>
      <button class="btn" id="stop" hidden>Arrêter</button>
      <button class="btn primary" id="send">Envoyer</button>
    </div>
  </div>
</footer>
</div>
</div>

<script src="/i18n.js"></script>
<script>
document.querySelectorAll(".langsel").forEach(I18N.select);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ss = { get(k) { try { return sessionStorage.getItem(k) } catch { return null } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v) } catch {} } };
const ls = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let key = ss.get("gwkey") || "", me = null, history = [], pending = [], ctrl = null, convId = ss.get("gwconv") || "";
const MAX_CONVS = 10;
// a gateway key (header), or an SSO session (cookie + anti-CSRF header)
const authHeaders = () => key ? { Authorization: "Bearer " + key } : { "X-LLMGW-Session": "1" };
async function showLoginPage(msg) {
  $("#login").hidden = false; $("#loginerr").textContent = msg || "";
  try {
    const a = await (await fetch("/auth/providers")).json();
    const ic = { entra: "M", google: "G", oidc: "↪" };
    $("#sso").innerHTML = a.providers.map(p => `<a href="/auth/login/${encodeURIComponent(p.ID)}?next=/chat"><span class="ic">${ic[p.Type] || "↪"}</span>Se connecter avec ${esc(p.Label)}</a>`).join("");
    $("#sso").hidden = !a.providers.length;
    $("#keylogin").hidden = !a.keys;
    if (a.providers.length && a.keys) $("#sso").insertAdjacentHTML("beforeend", `<div class="sep">ou avec une clé</div>`);
  } catch {}
}
const MAX_DOC = 300000;

// ---------- auth ----------
async function login() {
  const r = await fetch("/v1/me", { headers: authHeaders() });
  if (!r.ok) {
    const viaKey = !!key; ss.set("gwkey", null); key = "";
    let msg = viaKey ? "Clé refusée" : "";
    if (!viaKey) { try { const s = await fetch("/auth/session"); if (s.ok) { const j = await s.json(); msg = j.profile ? "Accès refusé pour " + j.email : `Connecté en tant que ${j.email}, mais aucun profil de chat ne vous est attribué.`; } } catch {} }
    return showLoginPage(msg);
  }
  me = await r.json();
  $("#login").hidden = true; for (const id of ["#top", "#log", "#foot", "#side"]) $(id).hidden = false;
  $("#who").textContent = `${me.user} · profil ${me.profile}`;
  const imgs = { pass: "images transmises", strip: "images retirées avant envoi", block: "images interdites" }[me.images];
  $("#policy").textContent = `Données sensibles pseudonymisées avant envoi · ${imgs}`;
  // one group per allowed LLM; targets without a key are listed as unavailable
  const ids = [];
  let h = "";
  for (const t of me.targets) {
    const ms = (t.Models || []).filter(m => !m.includes("*")), wild = (t.Models || []).filter(m => m.includes("*"));
    h += `<optgroup label="${esc(t.Name)}${t.Ready ? "" : " (pas de clé)"}">` + ms.map(m => { const id = t.Name + "/" + m; if (t.Ready) ids.push(id); return `<option value="${esc(id)}" ${t.Ready ? "" : "disabled"}>${esc(m)}</option>`; }).join("")
      + (wild.length ? `<option value="__other:${esc(t.Name)}" ${t.Ready ? "" : "disabled"}>${esc(wild.join(", "))} : autre…</option>` : "") + `</optgroup>`;
  }
  $("#modelSel").innerHTML = h;
  const saved = ls.get("gwmodel");
  if (saved && ids.includes(saved)) $("#modelSel").value = saved;
  else if (saved && saved.includes("/") && me.targets.some(t => t.Ready && saved.startsWith(t.Name + "/"))) { $("#modelSel").value = "__other:" + saved.split("/")[0]; $("#model").value = saved.split("/").slice(1).join("/"); }
  else $("#modelSel").value = ids[0] || "";
  syncModel();
  try { history = JSON.parse(ss.get("gwhist") || "[]"); } catch { history = []; }
  renderAll(); renderConvs(); $("#input").focus();
}
$("#loginf").onsubmit = e => { e.preventDefault(); key = $("#key").value.trim(); ss.set("gwkey", key); login(); };
$("#logout").onclick = async () => {
  ss.set("gwkey", null); ss.set("gwhist", null); ss.set("gwconv", null);
  if (!key) { try { await fetch("/auth/logout", { method: "POST", headers: { "X-LLMGW-Session": "1" } }); } catch {} }
  location.reload();
};
function currentModel() {
  const v = $("#modelSel").value;
  if (v.startsWith("__other:")) { const m = $("#model").value.trim(); return m ? v.slice(8) + "/" + m : ""; }
  return v;
}
function syncModel() { $("#model").hidden = !$("#modelSel").value.startsWith("__other:"); if (currentModel()) ls.set("gwmodel", currentModel()); }
$("#modelSel").onchange = () => { syncModel(); if (!$("#model").hidden) $("#model").focus(); };
$("#model").onchange = syncModel;
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const t = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; ls.set("gwtheme", t); };
if (ls.get("gwtheme")) document.documentElement.dataset.theme = ls.get("gwtheme");

// ---------- attachments ----------
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("chargement impossible : " + src)); document.head.appendChild(s); }); }
async function pdfText(buf) {
  const pdfjs = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
  pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
  const doc = await pdfjs.getDocument({ data: buf }).promise; let out = "";
  for (let i = 1; i <= doc.numPages; i++) { const c = await (await doc.getPage(i)).getTextContent(); out += c.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("") + "\n\n"; }
  return out;
}
async function docxText(buf) {
  if (!window.mammoth) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js");
  return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
}
async function addFile(f) {
  let ext = (f.name.includes(".") ? f.name.split(".").pop() : "").toLowerCase(); if (ext === "jpeg") ext = "jpg";
  if (ext && (me?.blocked_files || []).includes(ext)) { pending.push({ name: f.name, error: `fichiers .${ext} interdits par votre profil` }); renderAtts(); return; }
  const a = { name: f.name, size: f.size, loading: true }; pending.push(a); renderAtts();
  try {
    if (f.type.startsWith("image/")) {
      a.kind = "image"; a.data = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); });
    } else {
      a.kind = "doc"; const lower = f.name.toLowerCase();
      a.text = lower.endsWith(".pdf") ? await pdfText(await f.arrayBuffer()) : lower.endsWith(".docx") ? await docxText(await f.arrayBuffer()) : await f.text();
      a.text = a.text.replace(/\n{3,}/g, "\n\n").trim();
      if (!a.text) throw new Error("aucun texte extrait (document scanné ?)");
      if (a.text.length > MAX_DOC) { a.text = a.text.slice(0, MAX_DOC); a.truncated = true; }
    }
  } catch (e) { a.error = e.message; }
  a.loading = false; renderAtts();
}
function renderAtts() {
  $("#atts").innerHTML = pending.map((a, i) => `<span class="att" translate="no">${a.kind === "image" && a.data ? `<img src="${a.data}" alt="">` : "📄"} ${esc(a.name)}
    ${a.loading ? "<em>lecture…</em>" : a.error ? `<span class="err">${esc(a.error)}</span>` : a.kind === "doc" ? `<span class="hint">${Math.round(a.text.length / 1000)} k car.${a.truncated ? " (tronqué)" : ""}</span>` : ""}
    <button data-rm="${i}" title="Retirer">✕</button></span>`).join("");
}
$("#atts").onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { pending.splice(+b.dataset.rm, 1); renderAtts(); } };
$("#attach").onclick = () => $("#file").click();
$("#file").onchange = e => { [...e.target.files].forEach(addFile); e.target.value = ""; };
const comp = $("#composer");
comp.ondragover = e => { e.preventDefault(); comp.classList.add("drag"); };
comp.ondragleave = () => comp.classList.remove("drag");
comp.ondrop = e => { e.preventDefault(); comp.classList.remove("drag"); [...e.dataTransfer.files].forEach(addFile); };
$("#input").addEventListener("paste", e => { const fs = [...e.clipboardData.files]; if (fs.length) { e.preventDefault(); fs.forEach(addFile); } });

// ---------- rendering ----------
function md(t) {
  const parts = String(t).split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g); let h = "";
  for (let i = 0; i < parts.length; i += 3) {
    h += esc(parts[i]).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .split(/\n{2,}/).map(p => p.trim() ? `<p>${p.replace(/\n/g, "<br>")}</p>` : "").join("");
    if (parts[i + 2] != null) h += `<pre><code>${esc(parts[i + 2])}</code></pre>`;
  }
  return h;
}
function metaHTML(m) {
  if (!m) return "";
  const parts = m.kinds ? m.kinds.split(",").map(k => k.split(":")) : [];
  const kinds = parts.map(([k, n]) => `${k} ×${n}`).join(", "), ent = parts.reduce((a, [, n]) => a + +n, 0);
  return `<div class="meta">${m.target ? `<span>→ ${esc(m.target)}</span>` : ""}
    ${m.conv > 0 ? `<span class="badge shield" title="Ces valeurs ont été remplacées par des jetons avant envoi, puis restaurées dans la réponse">${ent || m.conv} donnée(s) pseudonymisée(s) : ${esc(kinds)}${m.conv > ent ? ` · ${m.conv} occurrences dans la conversation` : ""}</span>` : m.target ? `<span class="badge none">aucune donnée sensible détectée</span>` : ""}
    ${m.ms ? `<span>${(m.ms / 1000).toFixed(1)} s</span>` : ""}${m.tok ? `<span>${m.tok.in} → ${m.tok.out} tokens</span>` : ""}</div>`;
}
function msgHTML(m, i) {
  if (m.role === "user") {
    const atts = (m.atts || []).map(a => `<span class="att" translate="no">${a.kind === "image" ? "🖼" : "📄"} ${esc(a.name)}</span>`).join("");
    return `<div class="msg user"><div class="bubble" translate="no">${esc(m.text)}</div>${atts ? `<div>${atts}</div>` : ""}${metaHTML(m.meta)}</div>`;
  }
  return `<div class="msg assistant"><div translate="no" class="bubble ${m.streaming ? "cursor" : ""}" id="b${i}">${m.error ? `<span class="err">${esc(m.error)}</span>` : md(m.text || "")}</div>${metaHTML(m.meta)}</div>`;
}
function renderAll() {
  $("#msgs").innerHTML = history.length ? history.map(msgHTML).join("")
    : `<div class="empty"><b>Bonjour ${esc(me?.user || "")}</b>Vos messages passent par le gateway : noms, emails, numéros de dossier… sont remplacés par des jetons avant d'atteindre le LLM, puis restaurés dans la réponse.</div>`;
  $("#log").scrollTop = $("#log").scrollHeight;
}
function save() {
  ss.set("gwhist", JSON.stringify(history.map(m => ({ ...m, atts: m.atts?.map(a => ({ name: a.name, kind: a.kind, text: a.text, data: a.kind === "image" ? a.data : undefined })) }))));
  archive();
}

// ---------- conversation history: the last 10, per user, in this browser ----------
// Images are not kept (too large); a reopened conversation shows their names only.
const convKey = () => "gwconvs:" + (me?.user || "");
function loadConvs() { try { return JSON.parse(ls.get(convKey()) || "[]"); } catch { return []; } }
function storeConvs(list) {
  for (list = list.slice(0, MAX_CONVS); ; list.pop()) {
    try { localStorage.setItem(convKey(), JSON.stringify(list)); return; }
    catch { if (list.length <= 1) return; } // storage full: drop the oldest
  }
}
function archive() {
  if (!history.some(m => m.role === "user" && !m.streaming)) return;
  if (!convId) { convId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); ss.set("gwconv", convId); }
  const first = history.find(m => m.role === "user");
  const conv = { id: convId, title: (first?.text || "").replace(/\s+/g, " ").slice(0, 80), ts: Date.now(),
    history: history.filter(m => !m.streaming).map(m => ({ ...m, atts: m.atts?.map(a => ({ name: a.name, kind: a.kind, text: a.text })) })) };
  storeConvs([conv, ...loadConvs().filter(c => c.id !== convId)]);
  renderConvs();
}
function renderConvs() {
  const list = loadConvs();
  $("#convs").innerHTML = `<button class="btn" id="new2" style="width:100%;margin:2px 0 8px">+ Nouvelle conversation</button>` + (list.length ? list.map(c => `
    <div class="conv ${c.id === convId ? "cur" : ""}" data-id="${esc(c.id)}">
      <button class="open" data-act="open"><span class="t" translate="no">${esc(c.title || "…")}</span><span class="d">${new Date(c.ts).toLocaleString(I18N.loc, { dateStyle: "short", timeStyle: "short" })}</span></button>
      <button class="more" data-act="menu" title="Actions" aria-label="Actions" aria-haspopup="menu">⋯</button>
    </div>`).join("") : `<div class="none">Aucune conversation enregistrée</div>`);
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
function openConv(id) {
  const c = loadConvs().find(c => c.id === id); if (!c) return;
  if (ctrl) ctrl.abort();
  convId = c.id; ss.set("gwconv", convId); history = c.history || [];
  ss.set("gwhist", JSON.stringify(history));
  pending = []; renderAtts(); renderAll(); renderConvs(); $("#side").classList.remove("show"); $("#input").focus();
}
function deleteConv(id) {
  if (!confirm("Supprimer cette conversation ?")) return;
  storeConvs(loadConvs().filter(c => c.id !== id));
  if (id === convId) newConv(); else renderConvs();
}
function newConv() {
  if (ctrl) ctrl.abort();
  history = []; convId = ""; ss.set("gwconv", null); ss.set("gwhist", null);
  pending = []; renderAtts(); renderAll(); renderConvs(); $("#side").classList.remove("show"); $("#input").focus();
}
$("#convs").onclick = e => {
  if (e.target.closest("#new2")) return newConv();
  const b = e.target.closest("[data-act]"), row = e.target.closest(".conv"); if (!b || !row) return;
  const id = row.dataset.id, act = b.dataset.act;
  if (act === "open") return openConv(id);
  if (act === "del") { closeMenus(); return deleteConv(id); }
  if (act === "menu") {
    const had = row.querySelector(".menu"); closeMenus(); if (had) return;
    row.insertAdjacentHTML("beforeend", `<div class="menu" role="menu"><button role="menuitem" data-act="open">Afficher</button><button role="menuitem" class="danger" data-act="del">Supprimer</button></div>`);
    row.querySelector(".menu button").focus();
  }
};
document.addEventListener("click", e => { if (!e.target.closest(".conv")) closeMenus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });
$("#toggleSide").onclick = () => $("#side").classList.toggle("show");
$("#new").onclick = newConv;

// ---------- request ----------
function apiMessages() {
  return history.filter(m => !m.error && !m.streaming).map(m => {
    if (m.role === "assistant") return { role: "assistant", content: m.text };
    let text = m.text;
    for (const a of m.atts || []) if (a.kind === "doc") text += `\n\n--- Document joint : ${a.name} ---\n${a.text}\n--- Fin du document ---`;
    const imgs = (m.atts || []).filter(a => a.kind === "image" && a.data);
    return imgs.length ? { role: "user", content: [{ type: "text", text }, ...imgs.map(a => ({ type: "image_url", image_url: { url: a.data } }))] } : { role: "user", content: text };
  });
}
async function send() {
  const text = $("#input").value.trim();
  if (ctrl || (!text && !pending.length) || pending.some(a => a.loading)) return;
  const model = currentModel(); if (!model) { ($("#model").hidden ? $("#modelSel") : $("#model")).focus(); return; }
  ls.set("gwmodel", model);
  const atts = pending.filter(a => !a.error); pending = []; renderAtts();
  const um = { role: "user", text: text || "(voir document joint)", atts }; history.push(um);
  const am = { role: "assistant", text: "", streaming: true }; history.push(am);
  $("#input").value = ""; autosize(); renderAll();
  ctrl = new AbortController(); $("#stop").hidden = false; $("#send").disabled = true;
  const t0 = performance.now(); let buf = "";
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST", signal: ctrl.signal,
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ model, stream: true, messages: apiMessages() }) });
    const meta = { target: r.headers.get("X-Gateway-Target"), conv: +(r.headers.get("X-Gateway-Conversions") || 0), kinds: r.headers.get("X-Gateway-Kinds") || "" };
    um.meta = meta.target ? { conv: meta.conv, kinds: meta.kinds } : null;
    if (!r.ok || !(r.headers.get("Content-Type") || "").includes("event-stream")) {
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);
      am.text = j.choices?.[0]?.message?.content || "";
    } else {
      const rd = r.body.getReader(), dec = new TextDecoder(); let tok = null, last = 0;
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of ev.split("\n")) {
            if (!line.startsWith("data:")) continue; const d = line.slice(5).trim(); if (d === "[DONE]") continue;
            try { const j = JSON.parse(d); const c = j.choices?.[0]?.delta?.content; if (c) am.text += c; if (j.usage) tok = { in: j.usage.prompt_tokens, out: j.usage.completion_tokens }; if (j.error) throw new Error(j.error.message); } catch (e) { if (e.message && !(e instanceof SyntaxError)) throw e; }
          }
        }
        if (performance.now() - last > 60) { last = performance.now(); const b = $("#b" + (history.length - 1)); if (b) { b.innerHTML = md(am.text); $("#log").scrollTop = $("#log").scrollHeight; } }
      }
      meta.tok = tok;
    }
    am.meta = { target: meta.target, conv: meta.conv, kinds: meta.kinds, ms: performance.now() - t0, tok: meta.tok };
  } catch (e) {
    if (e.name === "AbortError") am.text += "\n\n_(interrompu)_"; else am.error = e.message;
  }
  am.streaming = false; ctrl = null; $("#stop").hidden = true; $("#send").disabled = false;
  save(); renderAll(); $("#input").focus();
}
$("#send").onclick = send;
$("#stop").onclick = () => ctrl?.abort();
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(240, t.scrollHeight) + "px"; }
$("#input").addEventListener("input", autosize);

login(); // with the stored key, or the SSO session cookie if there is one
</script>
